<!DOCTYPE html>
<html lang="en">

<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt experiment</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #121212;
            color: #eeeeee;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 700px;
            margin-top: 80px;
        }

       textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            box-sizing: border-box;
            background: #1e1e1e;
            color: #eeeeee;
            border: 1px solid #444;
            border-radius: 6px;
            resize: vertical;
        }

        .temperature {
            margin: 20px 0;
        }

                button {
            padding: 10px 20px;
            background: #eeeeee;
            color: #121212;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #cccccc;
        }

        #response {
            margin-top: 30px;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 6px;
            white-space: pre-wrap;

            
        }

        #tokenInfo {
        margin-top: 12px;
        color: #aaaaaa;
        font-size: 14px;
        display: flex;
        gap: 20px;

        }

        #chat {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            white-space: pre-wrap;
        }

        .user {
            background: #2a2a2a;
        }

        .assistant {
            background: #1e1e1e;
        }

    </style>
</head>

<body>

<div class="container">
    <h1> Prompt Lab</h1>

    
    <textarea
        id="prompt"
        placeholder="Enter prompt"
    ></textarea>

    <div class="temperature">
        <label>
            Temperature:
            <span id="temperatureValue"> 0.7 </span>
        </label>

        <input
        id="temperature"
        type="range"
        min="0"
        max="2"
        step="0.1"
        value="0.7"
        >

        <label>
            Top P:
            <span id="topPValue"> 0.9 </span>
        </label>

        <input
            id="top_p"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.9"
        >
        
        <label for="seed"> Seed </label>
        <input 
            id="seed"
            type="number"
            value="42"
            step="1"
        >
        
        <label for="maxTokens"> Max Tokens </label>
        <input
            id="maxTokens"
            type="number"
            value="500"
            min="1"
            step="1"
        >
    </div>

    <button onclick="generate()"> Generate </button>
    
    <div id="chat"></div>

    <div id="tokenInfo">
        <span>Prompt Tokens: <strong id="promptTokens"> 0 </strong></span>
        <span> Generated Tokens: <strong id="generatedTokens"> 0</strong></span>
        <span> Total Tokens: <strong id="totalTokens"> 0 </strong></span>

    </div>
</div>

<script> 
    const temperature = document.getElementById("temperature")
    const temepratureValue = document.getElementById("temperatureValue")

    const top_p = document.getElementById("top_p");
    const topPValue = document.getElementById("topPValue")

    const seed = document.getElementById("seed");
    const maxTokens = document.getElementById("maxTokens")

    const chat = document.getElementById("chat");

    top_p.addEventListener("input", () => {
        topPValue.textContent = top_p.value;
    });

    temperature.addEventListener("input", () => {
        temepratureValue.textContent = temperature.value
    });

    async function generate() {
        const prompt = document.getElementById("prompt").value;

        const userMessage = document.createElement("div")
            userMessage.className = "message user";
            userMessage.textContent = prompt;
            chat.appendChild(userMessage);
        

        const response = await fetch("/prompt", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                prompt: prompt,
                temperature: parseFloat(temperature.value),
                top_p: parseFloat(top_p.value),
                seed: parseInt(seed.value),
                maxTokens: parseInt(maxTokens.value)
            })
        });

        const data = await response.json();

        document.getElementById("promptTokens").textContent = data.promptTokens;
        document.getElementById("generatedTokens").textContent = data.generatedTokens;
        document.getElementById("totalTokens").textContent = data.promptTokens + data.generatedTokens;

        const assistantMessage = document.createElement("div");
        assistantMessage.className = "message assistant";
        assistantMessage.textContent = data.response;
        chat.appendChild(assistantMessage)

    }

</script>
</body>
</html>
